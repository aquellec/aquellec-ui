<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 186 34" fill="none" role="img" aria-label="aquellec/ui">
  <!--
    The mark is the signature gesture at its largest: a black block with the 4px
    Flare rule down its leading edge, and one threshold tick laid across the
    figure it measures. Nothing else. A wordmark that needs an abstract glyph to
    explain itself is a wordmark that lost an argument.
  -->
  <rect x="0" y="1" width="32" height="32" rx="6" fill="#0a0a09"/>
  <rect x="0" y="1" width="4" height="32" fill="#e01e79"/>
  <path d="M11 25V9" stroke="#ffffff" stroke-width="3" stroke-linecap="square"/>
  <path d="M11 17h13" stroke="#ffffff" stroke-width="3" stroke-linecap="square"/>
  <path d="M24 12v10" stroke="#2440dd" stroke-width="3" stroke-linecap="square"/>

  <text x="44" y="24"
        font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="20" font-weight="800" letter-spacing="-0.8"
        fill="#0a0a09">aquellec</text>
  <text x="139" y="24"
        font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="20" font-weight="400" letter-spacing="-0.8"
        fill="#6b6862">/ui</text>
</svg>
